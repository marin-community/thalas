[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[project]
name = "thalas"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}

requires-python = ">=3.11"
dependencies = [
    # Marin leaf packages. In the marin uv workspace these resolve to the local
    # lib/* members via [tool.uv.sources]; standalone they resolve to the PyPI
    # releases. Pinned loosely so the in-workspace version always satisfies them.
    "marin-rigging",
    "marin-fray",
    "draccus>=0.11.6",
    "fsspec",
    "pydantic",
]

[dependency-groups]

test = [
    # marin-iris is only needed by test_step_runner (it exercises iris-backed
    # job dispatch); the executor itself reaches iris transitively via fray.
    "marin-iris",
    "pytest>=8.3.2",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
]
lint = [
    "ruff>=0.5.7",
    "black>=24.8.0",
    "pre-commit==4.2",
    "mypy>=1.4.1",
]

dev = [
    {include-group="test"},
    {include-group="lint"},
]

[tool.black]
line-length = 121
target-version = ["py311"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py311"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "NPY", "RUF", "UP", "W"]
ignore = ["F722", "B008", "UP015", "A005", "I001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
# Type stubs re-export names by design.
"*.pyi" = ["E402", "F401", "E501"]

[tool.mypy]
python_version = "3.11"

[tool.uv]
# The marin-* leaf packages publish only dev/pre-release builds to PyPI.
prerelease = "allow"

[tool.uv_build]
package-dir = "src"

[tool.pytest.ini_options]
timeout = 300
